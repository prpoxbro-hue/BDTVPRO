<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOG SCRIPT V1 - Signal App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Orbitron & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #05000a url('https://i.ibb.co.com/1fKPc4RW/file-00000000b4c4821182a2c0453fb1ca2a.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .font-orbitron {
      font-family: 'Orbitron', monospace;
    }

    /* Glow Effects */
    .glow-box-purple {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.25), inset 0 0 15px rgba(168, 85, 247, 0.15);
      border: 1.5px solid rgba(168, 85, 247, 0.6);
    }

    .glow-box-interactive:focus-within {
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.5), inset 0 0 10px rgba(168, 85, 247, 0.3);
      border-color: #c084fc;
    }

    .glow-btn-purple {
      background: linear-gradient(135deg, #7e22ce 0%, #9333ea 50%, #6b21a8 100%);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .glow-btn-purple:active {
      transform: scale(0.98);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
    }

    .glow-text-neon {
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.9), 0 0 24px rgba(147, 51, 234, 0.6);
    }

    .glow-circle-outer {
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), inset 0 0 25px rgba(147, 51, 234, 0.3);
    }

    /* Dial Dash Animation */
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: rotateRing 14s linear infinite;
    }

    /* Dial Tick Styling */
    .tick-ring {
      background: repeating-conic-gradient(
        from 0deg,
        #c084fc 0deg 1.5deg,
        transparent 1.5deg 6deg
      );
      mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
    }
  </style>
</head>
<body class="flex items-center justify-center p-3 select-none">

  <!-- Main Mobile Canvas Container -->
  <div class="relative w-full max-w-sm sm:max-w-md min-h-[640px] flex flex-col justify-between items-center">

    <!-- ========================================== -->
    <!-- SCREEN 1: LOGIN / ACTIVATION PANEL         -->
    <!-- ========================================== -->
    <div id="loginScreen" class="w-full flex flex-col items-center justify-between rounded-3xl p-6 py-8 border border-purple-500/40 glow-box-purple bg-[#0d021c]/90 backdrop-blur-md transition-all duration-500 transform">
      
      <!-- Top Branding (Replaced with Custom Image) -->
      <div class="flex flex-col items-center mt-1 w-full">
        <div class="w-full max-w-[260px] sm:max-w-[280px] flex items-center justify-center">
          <img 
            src="https://i.ibb.co.com/VWgwsQNB/file-0000000068dc82119330442efde42c92.png" 
            alt="Dog Script Header" 
            class="w-full h-auto object-contain drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]"
            loading="eager"
          />
        </div>
      </div>

      <!-- Input Fields Form -->
      <div class="w-full space-y-4 my-6">
        
        <!-- User ID Input -->
        <div class="glow-box-purple glow-box-interactive bg-[#130424]/90 rounded-2xl px-4 py-3.5 transition-all">
          <input 
            type="text" 
            id="uidInput" 
            inputmode="numeric" 
            maxlength="10" 
            placeholder="ENTER YOUR GAME UID"
            class="w-full bg-transparent text-center text-sm sm:text-base font-semibold text-white placeholder-purple-300/50 uppercase tracking-widest focus:outline-none"
          />
        </div>

        <!-- Promo Code Input -->
        <div class="glow-box-purple bg-[#130424]/90 rounded-2xl px-4 py-3.5 border border-purple-500/50">
          <input 
            type="text" 
            id="promoInput" 
            value="PROMO CODE BLACK696" 
            readonly 
            class="w-full bg-transparent text-center text-xs tracking-wider uppercase font-semibold text-purple-200 cursor-default focus:outline-none"
          />
        </div>

        <!-- Error Notification Banner -->
        <div id="errorBanner" class="hidden text-center text-xs text-rose-300 bg-rose-950/70 border border-rose-500/60 rounded-xl p-2.5 transition duration-300 font-medium">
          <!-- Dynamically populated error message -->
        </div>

        <!-- Activate Button -->
        <button 
          id="activateBtn" 
          type="button" 
          class="w-full glow-btn-purple text-white font-black text-sm tracking-widest py-4 rounded-2xl uppercase font-orbitron transition duration-200 shadow-lg cursor-pointer">
          ACTIVATE
        </button>
      </div>

      <!-- Telegram Round Icon -->
      <div class="mt-2 mb-1">
        <a 
          href="https://t.me" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="w-12 h-12 rounded-full border border-purple-400 flex items-center justify-center bg-[#150429] hover:bg-purple-900/60 shadow-[0_0_15px_rgba(168,85,247,0.5)] transition duration-200 cursor-pointer">
          <svg class="w-5 h-5 text-white transform -translate-x-0.5 translate-y-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.63 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.38-.49 1.04-.75 4.09-1.78 6.82-2.95 8.19-3.52 3.9-1.63 4.71-1.91 5.24-1.92.12 0 .37.03.54.17.14.12.18.28.2.45-.01.07-.01.21-.03.35z"/>
          </svg>
        </a>
      </div>

    </div>

    <!-- ========================================== -->
    <!-- SCREEN 2: SIGNAL DIAL PANEL                -->
    <!-- ========================================== -->
    <div id="signalScreen" class="hidden w-full flex-col items-center justify-between min-h-[640px] rounded-3xl p-6 py-8 border border-purple-500/40 glow-box-purple bg-[#0d021c]/95 backdrop-blur-md transition-all duration-500 transform">
      
      <!-- Top Small Header -->
      <div class="w-full flex flex-col items-center">
        <!-- Tiny Dog Icon -->
        <div class="w-7 h-7 mb-1 opacity-90">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" stroke="#d8b4fe" stroke-width="3">
            <polygon points="25,50 18,15 38,32" fill="#24083d" />
            <polygon points="75,50 82,15 62,32" fill="#24083d" />
            <path d="M30,38 L70,38 L78,60 L50,88 L22,60 Z" fill="#170327" />
            <polygon points="32,46 42,49 36,53" fill="#ffffff" />
            <polygon points="68,46 58,49 64,53" fill="#ffffff" />
          </svg>
        </div>
        <p class="text-[9px] tracking-widest uppercase font-orbitron font-semibold text-purple-300">DOG SCRIPT V1</p>
        <p class="text-[11px] font-bold tracking-wider text-purple-200 uppercase mt-0.5 glow-text-neon">
          TELEGRAM : @SUNNY_BRO1
        </p>

        <!-- Live Clock Pill Box -->
        <div class="w-full mt-4 py-2.5 px-4 rounded-xl border border-purple-400/80 bg-[#140326] glow-box-purple flex items-center justify-center gap-2">
          <!-- Small Clock Icon -->
          <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
          <span id="liveDeviceClock" class="font-orbitron text-xl sm:text-2xl font-bold tracking-wider text-white glow-text-neon">
            00:00:00
          </span>
        </div>
      </div>

      <!-- Center Hologram Circular Dial -->
      <div class="relative w-64 h-64 sm:w-72 sm:h-72 my-6 flex items-center justify-center">
        
        <!-- Outer Glowing Accent Circle -->
        <div class="absolute inset-0 rounded-full border border-purple-500/40 glow-circle-outer"></div>

        <!-- Rotating Outer Orbit Line -->
        <div class="absolute inset-2 rounded-full border-2 border-transparent border-t-purple-400 border-r-purple-300/30 animate-spin-slow"></div>

        <!-- Middle Outer Rim -->
        <div class="absolute inset-5 rounded-full border border-purple-500/80 shadow-[0_0_15px_rgba(168,85,247,0.3)]"></div>

        <!-- Radar Ticks Ring -->
        <div class="absolute inset-8 rounded-full tick-ring opacity-95"></div>

        <!-- Inner Dark Center Core -->
        <div class="absolute inset-12 rounded-full bg-gradient-to-b from-[#24033e] to-[#0d0119] border border-purple-400/70 flex flex-col items-center justify-center shadow-inner">
          <span class="text-[11px] font-orbitron font-bold tracking-[0.25em] text-purple-300 uppercase">
            SIGNAL
          </span>
          <div id="signalValueDisplay" class="font-orbitron font-black text-4xl sm:text-5xl text-white glow-text-neon mt-1 tracking-tight">
            1.13
          </div>
          <span id="signalStatus" class="text-[9px] font-semibold tracking-wider text-emerald-400 mt-1 uppercase">
            CONNECTED
          </span>
        </div>
      </div>

      <!-- Bottom Actions -->
      <div class="w-full space-y-3">
        <!-- Join Telegram Button -->
        <a 
          href="https://t.me/SUNNY_BRO1" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="w-full py-3.5 px-4 rounded-full border-2 border-purple-400/80 bg-[#180430] hover:bg-purple-900/40 flex items-center justify-center gap-2 text-white font-bold tracking-wider text-xs sm:text-sm uppercase font-orbitron shadow-[0_0_20px_rgba(168,85,247,0.4)] transition cursor-pointer">
          <svg class="w-4 h-4 text-purple-300" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          <span>JOIN TELEGRAM</span>
          <svg class="w-4 h-4 text-purple-300 transform rotate-180" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </a>

        <!-- Log Out / Switch Back Option -->
        <button 
          id="backToLoginBtn" 
          type="button" 
          class="w-full text-center text-xs text-purple-400 hover:text-purple-200 transition underline underline-offset-4 cursor-pointer font-medium pt-1">
          ← Back to Login
        </button>
      </div>

    </div>

  </div>

  <!-- Client-Side JavaScript Logic -->
  <script>
    // DOM Elements
    const loginScreen = document.getElementById('loginScreen');
    const signalScreen = document.getElementById('signalScreen');
    const uidInput = document.getElementById('uidInput');
    const activateBtn = document.getElementById('activateBtn');
    const errorBanner = document.getElementById('errorBanner');
    const liveDeviceClock = document.getElementById('liveDeviceClock');
    const signalValueDisplay = document.getElementById('signalValueDisplay');
    const backToLoginBtn = document.getElementById('backToLoginBtn');

    // Interval reference for Signal Generation
    let signalInterval = null;

    // Helper: Display inline error message without alert()
    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.remove('hidden');
    }

    // Helper: Hide error message
    function hideError() {
      errorBanner.classList.add('hidden');
      errorBanner.textContent = '';
    }

    // 1. Live Device Time Clock Function
    function updateLiveClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      liveDeviceClock.textContent = `${hours}:${minutes}:${seconds}`;
    }

    // Start Clock immediately and refresh every 1000ms
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    // 2. Simulated Dynamic Multiplier Generation
    function generateSignalMultiplier() {
      // Produces realistic multipliers between 1.10 and 9.85
      const randomValue = (Math.random() * (7.50 - 1.10) + 1.10).toFixed(2);
      
      // Flash effect on new signal
      signalValueDisplay.classList.add('opacity-40');
      setTimeout(() => {
        signalValueDisplay.textContent = randomValue;
        signalValueDisplay.classList.remove('opacity-40');
      }, 150);
    }

    // 3. Login & Validation Logic
    function handleActivation() {
      hideError();
      const uidValue = uidInput.value.trim();

      // Check UID numeric length: must be either 9 or 10 digits
      const isDigitsOnly = /^\d+$/.test(uidValue);
      const isValidLength = uidValue.length === 9 || uidValue.length === 10;

      if (!isDigitsOnly || !isValidLength) {
        showError("Invalid UID! Please enter a 9-digit or 10-digit number.");
        uidInput.focus();
        return;
      }

      // Successful verification: Transition from Login to Signal Screen
      loginScreen.classList.add('hidden');
      signalScreen.classList.remove('hidden');
      signalScreen.classList.add('flex');

      // Set initial signal multiplier and schedule dynamic updates
      generateSignalMultiplier();
      if (signalInterval) clearInterval(signalInterval);
      signalInterval = setInterval(generateSignalMultiplier, 6000);
    }

    // Event Listeners for Login
    activateBtn.addEventListener('click', handleActivation);

    // Allow Enter key on UID input to trigger login directly
    uidInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleActivation();
    });

    // Tap on dial value to manually generate a new signal
    signalValueDisplay.addEventListener('click', () => {
      generateSignalMultiplier();
    });

    // 4. Back to Login button
    backToLoginBtn.addEventListener('click', () => {
      if (signalInterval) clearInterval(signalInterval);
      signalScreen.classList.add('hidden');
      signalScreen.classList.remove('flex');
      loginScreen.classList.remove('hidden');
      hideError();
    });
  </script>
</body>
</html>
