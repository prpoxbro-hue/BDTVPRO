<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMEN | Instant Video Connect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Scripts (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #07090e;
      --card: rgba(18, 22, 34, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f2fe;
      --blue: #4facfe;
      --purple: #7928ca;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      height: 65px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(15px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-online::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 15px;
      padding: 15px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      height: calc(100vh - 65px);
    }

    .video-deck {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .videos-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .video-card {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-card.remote {
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-card.local video {
      transform: scaleX(-1);
    }

    .user-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .screen-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-sub);
      text-align: center;
      padding: 15px;
      z-index: 1;
    }

    .radar-pulse {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.15);
      border: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
      70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 20px rgba(0, 242, 254, 0); }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
    }

    .controls-panel {
      height: 75px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(20px);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 1rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-icon.off {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-next {
      height: 48px;
      padding: 0 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #000;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
      gap: 8px;
    }

    .btn-next:active {
      transform: scale(0.97);
    }

    .chat-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      height: 100%;
    }

    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--purple), #4f46e5);
      color: #fff;
    }

    .msg-bubble.them {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-footer {
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid var(--border);
      display: flex;
    }

    .chat-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 12px;
      width: 100%;
    }

    .chat-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
    }

    .chat-box button {
      background: transparent;
      border: none;
      color: var(--cyan);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .app-container { grid-template-columns: 1fr; height: auto; }
      .videos-wrapper { height: 60vh; }
      .chat-panel { height: 350px; }
    }
    @media (max-width: 600px) {
      .videos-wrapper { grid-template-columns: 1fr; height: 70vh; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-bolt" style="color: var(--cyan);"></i>
      <span>LUMEN TV</span>
    </div>
    <div class="badge-online">
      <span id="statOnlineCount">1</span> Online
    </div>
  </header>

  <main class="app-container">
    <section class="video-deck">
      <div class="videos-wrapper">
        
        <!-- Local Stream -->
        <div class="video-card local">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="user-tag">
            <span>You</span>
          </div>
        </div>

        <!-- Remote Stream -->
        <div class="video-card remote">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="user-tag" id="partnerTag" style="display: none;">
            <span id="partnerName">Stranger</span>
          </div>
          
          <div class="screen-loader" id="radarLoader">
            <div class="radar-pulse">
              <i class="fa-solid fa-video" style="color: var(--cyan); font-size: 1.3rem;"></i>
            </div>
            <p id="loaderMessage">Click START on BOTH devices to match</p>
          </div>
        </div>

      </div>

      <!-- Video Actions Hub -->
      <div class="controls-panel">
        <div class="ctrl-group">
          <button class="btn btn-icon" id="micBtn" title="Mic On/Off"><i class="fa-solid fa-microphone"></i></button>
          <button class="btn btn-icon" id="camBtn" title="Cam On/Off"><i class="fa-solid fa-video"></i></button>
          <button class="btn btn-icon" id="switchCamBtn" title="Flip Camera"><i class="fa-solid fa-camera-rotate"></i></button>
        </div>

        <div class="ctrl-group">
          <button class="btn btn-next" id="nextBtn">
            <i class="fa-solid fa-play"></i>
            <span id="btnLabel">START</span>
          </button>
        </div>

        <div class="ctrl-group">
          <button class="btn btn-icon" id="fsBtn"><i class="fa-solid fa-expand"></i></button>
        </div>
      </div>
    </section>

    <!-- Side Chat -->
    <aside class="chat-panel">
      <div class="chat-header">
        <span>Live Conversation</span>
        <span style="font-size:0.75rem; color:var(--text-sub);" id="partnerStatusLabel">Standby</span>
      </div>

      <div class="chat-messages" id="chatList">
        <div class="msg-bubble them">
          ⚡ System ready. Click START to begin matchmaking.
        </div>
      </div>

      <div class="chat-footer">
        <form class="chat-box" id="chatForm">
          <input type="text" id="chatInput" placeholder="Send a message..." autocomplete="off">
          <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </aside>
  </main>

  <script>
    /* FIREBASE CONFIGURATION */
    const firebaseConfig = {
      apiKey: "AIzaSyAB5pjAvTcmbiZ7Ibr63e5gINIONvby8qs",
      authDomain: "copytvlive.firebaseapp.com",
      databaseURL: "https://copytvlive-default-rtdb.firebaseio.com",
      projectId: "copytvlive",
      storageBucket: "copytvlive.firebasestorage.app",
      messagingSenderId: "904851982861",
      appId: "1:904851982861:web:3fdc5da725b88ea6a76344"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // High quality STUN configuration
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:global.stun.twilio.com:3478" }
      ],
      iceCandidatePoolSize: 10
    };

    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let myUserId = null;
    let activeSessionId = null;
    let currentPartnerId = null;
    let isCaller = false;
    let facingMode = "user";
    let pendingIceCandidates = [];
    let isMatching = false;

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const nextBtn = document.getElementById('nextBtn');
    const btnLabel = document.getElementById('btnLabel');
    const loaderMessage = document.getElementById('loaderMessage');
    const radarLoader = document.getElementById('radarLoader');
    const partnerTag = document.getElementById('partnerTag');
    const partnerStatusLabel = document.getElementById('partnerStatusLabel');
    const chatList = document.getElementById('chatList');
    const chatInput = document.getElementById('chatInput');

    // 1. Initial Authentication
    auth.signInAnonymously().then(res => {
      myUserId = res.user.uid;
      
      const userRef = db.ref(`users/${myUserId}`);
      db.ref(".info/connected").on("value", snap => {
        if (snap.val() === true) {
          userRef.onDisconnect().remove();
          userRef.set({ online: true, ts: Date.now() });
        }
      });

      db.ref('users').on('value', snap => {
        document.getElementById('statOnlineCount').innerText = snap.numChildren() || 1;
      });

      // Always listen for direct invites
      listenForDirectSignals();
    }).catch(err => {
      alert("Database error: " + err.message);
    });

    // 2. Camera Initializer (Fallback protected)
    async function initCamera() {
      if (localStream) return true;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });
        localVideo.srcObject = localStream;
        await localVideo.play();
        return true;
      } catch (err) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          localVideo.srcObject = localStream;
          await localVideo.play();
          return true;
        } catch (finalErr) {
          loaderMessage.innerHTML = "<span style='color:var(--danger);'>Please allow camera & microphone access.</span>";
          return false;
        }
      }
    }

    // 3. Guaranteed Matchmaking Logic
    nextBtn.addEventListener('click', async () => {
      const ok = await initCamera();
      if (!ok) return;

      cleanupSession();
      isMatching = true;

      btnLabel.innerText = "SEARCHING";
      radarLoader.style.display = "flex";
      loaderMessage.innerText = "Looking for an available stranger...";
      partnerStatusLabel.innerText = "Matching...";

      // Check if someone else is already waiting
      const queueRef = db.ref('queue');
      
      queueRef.once('value').then(snap => {
        const queue = snap.val() || {};
        const availableUids = Object.keys(queue).filter(uid => uid !== myUserId);

        if (availableUids.length > 0) {
          // A partner is available! Grab them
          const partnerId = availableUids[0];
          
          // Remove partner and myself from queue immediately
          db.ref(`queue/${partnerId}`).remove();
          db.ref(`queue/${myUserId}`).remove();

          // I will be Caller and create Session
          activeSessionId = db.ref('sessions').push().key;
          currentPartnerId = partnerId;
          isCaller = true;

          // Dispatch signal to partner
          db.ref(`signals/${partnerId}`).set({
            sessionId: activeSessionId,
            partnerId: myUserId
          });

          startWebRTC();
        } else {
          // No one available yet, put myself in queue and wait
          queueRef.child(myUserId).set({ time: Date.now() });
          queueRef.child(myUserId).onDisconnect().remove();
          loaderMessage.innerText = "You are in queue. Waiting for another user...";
        }
      });
    });

    // Listen for direct invitations (Callee side)
    function listenForDirectSignals() {
      db.ref(`signals/${myUserId}`).on('value', async snap => {
        const val = snap.val();
        if (val && val.sessionId && !activeSessionId) {
          activeSessionId = val.sessionId;
          currentPartnerId = val.partnerId;
          isCaller = false;

          // Remove my traces from queue and signal
          db.ref(`queue/${myUserId}`).remove();
          db.ref(`signals/${myUserId}`).remove();

          const ok = await initCamera();
          if (ok) {
            startWebRTC();
          }
        }
      });
    }

    // 4. WebRTC Connection Setup
    async function startWebRTC() {
      btnLabel.innerText = "NEXT";
      loaderMessage.innerText = "Found a partner! Handshaking...";
      partnerStatusLabel.innerText = "Handshaking...";

      pendingIceCandidates = [];
      peerConnection = new RTCPeerConnection(rtcConfig);

      // Prepare empty stream for incoming remote video
      remoteStream = new MediaStream();
      remoteVideo.srcObject = remoteStream;

      // Add my tracks to WebRTC
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Handle receiving tracks
      peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => {
          remoteStream.addTrack(track);
        });

        remoteVideo.play().catch(e => console.log("Auto play prevented", e));
        radarLoader.style.display = "none";
        partnerTag.style.display = "flex";
        partnerStatusLabel.innerText = "Live";
      };

      const sessionRef = db.ref(`sessions/${activeSessionId}`);
      const myCandidatePath = isCaller ? 'callerCandidates' : 'calleeCandidates';
      const remoteCandidatePath = isCaller ? 'calleeCandidates' : 'callerCandidates';

      // Send local ICE candidates to Firebase
      peerConnection.onicecandidate = (e) => {
        if (e.candidate && activeSessionId) {
          sessionRef.child(myCandidatePath).push(e.candidate.toJSON());
        }
      };

      // Listen for incoming ICE candidates
      sessionRef.child(remoteCandidatePath).on('child_added', async snap => {
        const data = snap.val();
        if (data) {
          const candidate = new RTCIceCandidate(data);
          if (peerConnection && peerConnection.remoteDescription) {
            try {
              await peerConnection.addIceCandidate(candidate);
            } catch (err) {
              console.error("Candidate add error", err);
            }
          } else {
            pendingIceCandidates.push(candidate);
          }
        }
      });

      // SDP Offer / Answer Exchange
      if (isCaller) {
        // Create Offer
        const offer = await peerConnection.createOffer({
          offerToReceiveAudio: true,
          offerToReceiveVideo: true
        });
        await peerConnection.setLocalDescription(offer);

        await sessionRef.set({
          offer: { type: offer.type, sdp: offer.sdp }
        });

        // Listen for Answer
        sessionRef.child('answer').on('value', async snap => {
          const answer = snap.val();
          if (answer && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            flushPendingCandidates();
          }
        });
      } else {
        // Callee: Wait for offer
        sessionRef.child('offer').on('value', async snap => {
          const offer = snap.val();
          if (offer && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            flushPendingCandidates();

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await sessionRef.update({
              answer: { type: answer.type, sdp: answer.sdp }
            });
          }
        });
      }

      // Live Chat listener
      sessionRef.child('messages').on('child_added', snap => {
        renderMessage(snap.val());
      });

      // Disconnect handling
      peerConnection.oniceconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(peerConnection.iceConnectionState)) {
          partnerStatusLabel.innerText = "Left";
          partnerTag.style.display = "none";
          remoteVideo.srcObject = null;
          radarLoader.style.display = "flex";
          loaderMessage.innerText = "Partner disconnected. Click NEXT.";
        }
      };
    }

    // Process queued candidates
    async function flushPendingCandidates() {
      while (pendingIceCandidates.length > 0) {
        const cand = pendingIceCandidates.shift();
        try {
          await peerConnection.addIceCandidate(cand);
        } catch (e) {
          console.error("Error processing candidate", e);
        }
      }
    }

    // 5. Cleanup
    function cleanupSession() {
      if (activeSessionId) {
        db.ref(`sessions/${activeSessionId}`).remove();
      }
      db.ref(`queue/${myUserId}`).remove();
      db.ref(`signals/${myUserId}`).remove();

      if (peerConnection) {
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.close();
        peerConnection = null;
      }

      activeSessionId = null;
      currentPartnerId = null;
      remoteVideo.srcObject = null;
      partnerTag.style.display = "none";
      chatList.innerHTML = '';
      pendingIceCandidates = [];
      isMatching = false;
    }

    // 6. Chat form
    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const txt = chatInput.value.trim();
      if (!txt || !activeSessionId) return;

      db.ref(`sessions/${activeSessionId}/messages`).push({
        sender: myUserId,
        text: txt
      });
      chatInput.value = '';
    });

    function renderMessage(msg) {
      const isMe = msg.sender === myUserId;
      const b = document.createElement('div');
      b.className = `msg-bubble ${isMe ? 'me' : 'them'}`;
      b.innerText = msg.text;
      chatList.appendChild(b);
      chatList.scrollTop = chatList.scrollHeight;
    }

    // 7. Media toggles
    document.getElementById('micBtn').addEventListener('click', () => {
      if (!localStream) return;
      const t = localStream.getAudioTracks()[0];
      if (t) {
        t.enabled = !t.enabled;
        document.getElementById('micBtn').classList.toggle('off', !t.enabled);
      }
    });

    document.getElementById('camBtn').addEventListener('click', () => {
      if (!localStream) return;
      const t = localStream.getVideoTracks()[0];
      if (t) {
        t.enabled = !t.enabled;
        document.getElementById('camBtn').classList.toggle('off', !t.enabled);
      }
    });

    document.getElementById('switchCamBtn').addEventListener('click', async () => {
      facingMode = (facingMode === "user") ? "environment" : "user";
      if (localStream) {
        localStream.getTracks().forEach(tr => tr.stop());
        localStream = null;
      }
      await initCamera();
      if (peerConnection && localStream) {
        const vTrack = localStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && vTrack) sender.replaceTrack(vTrack);
      }
    });

    document.getElementById('fsBtn').addEventListener('click', () => {
      const elem = document.querySelector('.videos-wrapper');
      if (!document.fullscreenElement) elem.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    });

    window.addEventListener('beforeunload', cleanupSession);
  </script>
</body>
</html>
