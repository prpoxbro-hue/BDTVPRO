<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMEN | Premium Global Video Connect</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Scripts (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 34, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f2fe;
      --neon-blue: #4facfe;
      --neon-purple: #7928ca;
      --neon-pink: #ff007f;
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Glass Header */
    header {
      height: 70px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(7, 9, 14, 0.7);
      backdrop-filter: blur(15px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-icon {
      color: var(--neon-cyan);
      font-size: 1.5rem;
      -webkit-text-fill-color: initial;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-online::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
    }

    /* Main Grid Layout */
    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      height: calc(100vh - 70px);
    }

    /* Video Deck */
    .video-deck {
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
    }

    .videos-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      min-height: 0;
    }

    .video-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-card.remote {
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-card.local video {
      transform: scaleX(-1);
    }

    /* Overlays on Videos */
    .user-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .user-tag img.flag {
      width: 20px;
      height: 14px;
      border-radius: 2px;
      object-fit: cover;
    }

    .screen-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--text-sub);
      text-align: center;
      padding: 20px;
      z-index: 1;
    }

    .radar-pulse {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.15);
      border: 2px solid var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
      70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 25px rgba(0, 242, 254, 0); }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
    }

    /* Video Control Center */
    .controls-panel {
      height: 80px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(20px);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-icon.off {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-next {
      height: 50px;
      padding: 0 32px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      color: #000;
      font-size: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
      gap: 10px;
    }

    .btn-next:hover {
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.5);
      transform: translateY(-2px);
    }

    .btn-report {
      color: var(--text-sub);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-report:hover { color: var(--danger); }

    /* Right Live Chat System */
    .chat-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      height: 100%;
    }

    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--neon-purple), #4f46e5);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble.them {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    .typing-status {
      font-size: 0.75rem;
      color: var(--neon-cyan);
      padding: 4px 16px;
      min-height: 22px;
    }

    /* Chat Input Area */
    .chat-footer {
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 14px;
    }

    .chat-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
    }

    .chat-box button {
      background: transparent;
      border: none;
      color: var(--neon-cyan);
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Emoji Picker Drawer */
    .emoji-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emoji-btn:hover { transform: scale(1.3); }

    /* Modals & Overlays */
    .overlay-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #111420;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    /* Responsive Queries */
    @media (max-width: 960px) {
      .app-container {
        grid-template-columns: 1fr;
        height: auto;
        padding: 10px;
      }
      .videos-wrapper {
        height: 60vh;
      }
      .chat-panel {
        height: 380px;
      }
    }

    @media (max-width: 600px) {
      .videos-wrapper {
        grid-template-columns: 1fr;
        height: 70vh;
      }
      .controls-panel {
        padding: 0 12px;
      }
      .btn-next {
        padding: 0 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-bolt brand-icon"></i>
      <span>LUMEN TV</span>
    </div>
    <div class="header-stats">
      <div class="badge-online">
        <span id="statOnlineCount">0</span> Online
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main class="app-container">
    
    <!-- Video Stream Section -->
    <section class="video-deck">
      <div class="videos-wrapper">
        
        <!-- Local Stream -->
        <div class="video-card local" id="localCard">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="user-tag">
            <img id="myFlag" class="flag" src="https://flagcdn.com/w40/un.png" alt="Country">
            <span id="myNameTag">You</span>
          </div>
        </div>

        <!-- Remote Stream -->
        <div class="video-card remote" id="remoteCard">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="user-tag" id="partnerTag" style="display: none;">
            <img id="partnerFlag" class="flag" src="https://flagcdn.com/w40/un.png" alt="Country">
            <span id="partnerName">Stranger</span>
          </div>
          
          <div class="screen-loader" id="radarLoader">
            <div class="radar-pulse">
              <i class="fa-solid fa-magnifying-glass" style="color: var(--neon-cyan); font-size: 1.5rem;"></i>
            </div>
            <p id="loaderMessage">Press START or NEXT to connect with the world</p>
          </div>
        </div>

      </div>

      <!-- Controls Hub -->
      <div class="controls-panel">
        <div class="ctrl-group">
          <button class="btn btn-icon" id="micBtn" title="Toggle Mic">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <button class="btn btn-icon" id="camBtn" title="Toggle Camera">
            <i class="fa-solid fa-video"></i>
          </button>
          <button class="btn btn-icon" id="switchCamBtn" title="Flip Camera">
            <i class="fa-solid fa-camera-rotate"></i>
          </button>
        </div>

        <div class="ctrl-group">
          <button class="btn btn-next" id="nextBtn">
            <i class="fa-solid fa-forward"></i>
            <span>START</span>
          </button>
        </div>

        <div class="ctrl-group">
          <button class="btn-report" id="reportBtn" title="Report Stranger">
            <i class="fa-solid fa-shield-halved"></i> Report
          </button>
          <button class="btn btn-icon" id="fsBtn" title="Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Side Chat Section -->
    <aside class="chat-panel">
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <i class="fa-regular fa-comments" style="color:var(--neon-cyan)"></i>
          <span>Live Conversation</span>
        </div>
        <span style="font-size:0.75rem; color:var(--text-sub);" id="partnerStatusLabel">Waiting...</span>
      </div>

      <div class="chat-messages" id="chatList">
        <div class="msg-bubble them">
          👋 Welcome to Lumen! Be respectful and have fun connecting worldwide.
          <div class="msg-time">System</div>
        </div>
      </div>

      <div class="typing-status" id="typingStatus"></div>

      <div class="chat-footer">
        <!-- Fast Emoji Tray -->
        <div class="emoji-row">
          <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
          <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
          <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
          <button class="emoji-btn" onclick="sendEmoji('😍')">😍</button>
          <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
          <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
        </div>
        <form class="chat-box" id="chatForm">
          <input type="text" id="chatInput" placeholder="Type a friendly message..." autocomplete="off">
          <button type="submit" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </aside>

  </main>

  <!-- Report Modal -->
  <div class="overlay-modal" id="reportModal" style="display: none;">
    <div class="modal-box">
      <h3 style="margin-bottom: 15px; color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> Report User</h3>
      <p style="font-size:0.9rem; color: var(--text-sub); margin-bottom: 20px;">
        Please identify the issue. Abusive and non-compliant users are permanently banned.
      </p>
      <select id="reportReason" style="width:100%; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; margin-bottom: 20px;">
        <option value="Nudity / Inappropriate Content">Nudity / Inappropriate Content</option>
        <option value="Harassment / Hate Speech">Harassment / Hate Speech</option>
        <option value="Underage User">Underage User</option>
        <option value="Spam / Bot">Spam / Bot</option>
      </select>
      <div style="display:flex; gap:10px;">
        <button class="btn" style="flex:1; background:rgba(255,255,255,0.1); color:#fff; border-radius:10px; padding:10px;" onclick="closeReportModal()">Cancel</button>
        <button class="btn" style="flex:1; background:var(--danger); color:#fff; border-radius:10px; padding:10px;" onclick="submitReport()">Report & Next</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPTS -->
  <script>
    /* 1. FIREBASE CONFIGURATION */
    const firebaseConfig = {
      apiKey: "AIzaSyAB5pjAvTcmbiZ7Ibr63e5gINIONvby8qs",
      authDomain: "copytvlive.firebaseapp.com",
      databaseURL: "https://copytvlive-default-rtdb.firebaseio.com",
      projectId: "copytvlive",
      storageBucket: "copytvlive.firebasestorage.app",
      messagingSenderId: "904851982861",
      appId: "1:904851982861:web:3fdc5da725b88ea6a76344"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    /* 2. WEBRTC CONFIGURATION (STUN SERVERS) */
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    /* App States */
    let localStream = null;
    let peerConnection = null;
    let myUserId = null;
    let myUserData = {
      country: 'US',
      countryName: 'United States',
      name: 'Guest_' + Math.floor(1000 + Math.random() * 9000)
    };
    
    let activeSessionId = null;
    let currentPartnerId = null;
    let isInitiator = false;
    let currentFacingMode = 'user';
    let isSearching = false;
    let typingTimeout = null;

    /* DOM Selectors */
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const nextBtn = document.getElementById('nextBtn');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const fsBtn = document.getElementById('fsBtn');
    const radarLoader = document.getElementById('radarLoader');
    const loaderMessage = document.getElementById('loaderMessage');
    const partnerTag = document.getElementById('partnerTag');
    const partnerFlag = document.getElementById('partnerFlag');
    const partnerName = document.getElementById('partnerName');
    const partnerStatusLabel = document.getElementById('partnerStatusLabel');
    const chatList = document.getElementById('chatList');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const typingStatus = document.getElementById('typingStatus');

    /* 3. INITIALIZATION & AUTHENTICATION */
    async function initApp() {
      // Determine approximate geo-location safely (without exposing real IP)
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const geo = await res.json();
          myUserData.country = geo.country_code ? geo.country_code.toLowerCase() : 'us';
          myUserData.countryName = geo.country_name || 'Global';
        }
      } catch (e) {
        console.warn("Could not fetch location data:", e);
      }

      document.getElementById('myFlag').src = `https://flagcdn.com/w40/${myUserData.country}.png`;
      document.getElementById('myNameTag').innerText = `${myUserData.name} (${myUserData.country.toUpperCase()})`;

      // Authenticate Anonymously
      auth.signInAnonymously().then(cred => {
        myUserId = cred.user.uid;
        setupPresence();
      }).catch(err => {
        alert("Authentication failed: " + err.message);
      });

      // Camera & Mic Permissions
      await setupMediaStream();
    }

    async function setupMediaStream() {
      try {
        if(localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error("Camera access error:", err);
        loaderMessage.innerHTML = "<span style='color:var(--danger);'>Camera/Mic Permission Required!</span>";
      }
    }

    /* Presence and Online Tracker */
    function setupPresence() {
      const userRef = db.ref(`users/${myUserId}`);
      const connectedRef = db.ref(".info/connected");

      connectedRef.on("value", snap => {
        if (snap.val() === true) {
          userRef.onDisconnect().remove();
          userRef.set({
            uid: myUserId,
            name: myUserData.name,
            country: myUserData.country,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
        }
      });

      // Total online count listener
      db.ref("users").on("value", snap => {
        document.getElementById('statOnlineCount').innerText = snap.numChildren();
      });

      // Check if Banned
      db.ref(`banned/${myUserId}`).on("value", snap => {
        if (snap.exists()) {
          alert("Your device has been suspended for violating platform terms.");
          window.location.reload();
        }
      });
    }

    /* 4. MATCHMAKING ENGINE */
    async function startMatchmaking() {
      if (!localStream) {
        await setupMediaStream();
      }

      cleanupCurrentSession();
      isSearching = true;

      nextBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>SEARCHING</span>`;
      radarLoader.style.display = 'flex';
      loaderMessage.innerText = "Finding a partner...";
      partnerStatusLabel.innerText = "Looking for someone...";

      const queueRef = db.ref('queue');
      
      // Try to find someone waiting in queue
      queueRef.transaction(currentQueue => {
        if (!currentQueue) {
          // If queue empty, place self in queue
          return { [myUserId]: { ...myUserData, timestamp: Date.now() } };
        }

        const keys = Object.keys(currentQueue);
        // Look for someone who is not me
        const partnerKey = keys.find(k => k !== myUserId);

        if (partnerKey) {
          // Found match! Remove partner from queue
          const partnerData = currentQueue[partnerKey];
          delete currentQueue[partnerKey];
          return currentQueue;
        } else {
          // Only me in queue, keep me in queue
          currentQueue[myUserId] = { ...myUserData, timestamp: Date.now() };
          return currentQueue;
        }
      }, (error, committed, snapshot) => {
        if (error) {
          console.error("Transaction failure:", error);
          isSearching = false;
          return;
        }

        if (committed) {
          const queueVal = snapshot.val();
          // Check if we popped someone
          queueRef.once('value').then(latestSnap => {
            // Check for created sessions targeting me
            listenForInvites();
          });
        }
      });
    }

    function listenForInvites() {
      // Check if someone paired with me
      const activeRef = db.ref(`signals/${myUserId}`);
      activeRef.on('value', async snap => {
        const data = snap.val();
        if (data && data.sessionId && !activeSessionId) {
          activeSessionId = data.sessionId;
          currentPartnerId = data.partnerId;
          isInitiator = false;
          setupCallListeners(activeSessionId);
          connectWebRTC(false);
          db.ref(`queue/${myUserId}`).remove();
        }
      });

      // Scan if I should become initiator
      db.ref('queue').once('value', async snap => {
        const val = snap.val();
        if (val) {
          const keys = Object.keys(val);
          const opponentId = keys.find(k => k !== myUserId);
          if (opponentId && !activeSessionId) {
            // Remove opponent and create session
            db.ref(`queue/${opponentId}`).remove();
            db.ref(`queue/${myUserId}`).remove();

            const newSessionKey = db.ref('sessions').push().key;
            activeSessionId = newSessionKey;
            currentPartnerId = opponentId;
            isInitiator = true;

            // Signal partner to join this session
            await db.ref(`signals/${opponentId}`).set({
              sessionId: newSessionKey,
              partnerId: myUserId
            });

            setupCallListeners(activeSessionId);
            connectWebRTC(true);
          }
        }
      });
    }

    /* 5. WEBRTC PEER-TO-PEER ENGINE */
    async function connectWebRTC(isOffer) {
      peerConnection = new RTCPeerConnection(rtcConfig);

      // Add local media tracks
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Handle Incoming Remote Stream
      peerConnection.ontrack = event => {
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          radarLoader.style.display = 'none';
          nextBtn.innerHTML = `<i class="fa-solid fa-forward"></i> <span>NEXT</span>`;
          partnerStatusLabel.innerText = "Connected";
        }
      };

      // Handle ICE Candidates
      peerConnection.onicecandidate = event => {
        if (event.candidate && activeSessionId) {
          const candidatePath = isOffer ? 'callerCandidates' : 'calleeCandidates';
          db.ref(`sessions/${activeSessionId}/${candidatePath}`).push(event.candidate.toJSON());
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected' || 
            peerConnection.connectionState === 'failed' || 
            peerConnection.connectionState === 'closed') {
          handlePartnerDisconnected();
        }
      };

      if (isOffer) {
        try {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          await db.ref(`sessions/${activeSessionId}`).update({
            offer: { type: offer.type, sdp: offer.sdp },
            callerInfo: myUserData
          });
        } catch (e) {
          console.error("Offer creation failed:", e);
        }
      }
    }

    function setupCallListeners(sessionId) {
      const sessionRef = db.ref(`sessions/${sessionId}`);

      // Listen for Partner Offer / Answer
      sessionRef.on('value', async snap => {
        const session = snap.val();
        if (!session) return;

        // If callee receiving offer
        if (!isInitiator && session.offer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(session.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          await sessionRef.update({
            answer: { type: answer.type, sdp: answer.sdp },
            calleeInfo: myUserData
          });
          
          if(session.callerInfo) renderPartnerInfo(session.callerInfo);
        }

        // If caller receiving answer
        if (isInitiator && session.answer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(session.answer));
          if(session.calleeInfo) renderPartnerInfo(session.calleeInfo);
        }
      });

      // Listen for ICE Candidates
      const incomingCandidatePath = isInitiator ? 'calleeCandidates' : 'callerCandidates';
      sessionRef.child(incomingCandidatePath).on('child_added', snap => {
        const candidate = snap.val();
        if (candidate && peerConnection) {
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(console.error);
        }
      });

      // Chat Messages Listener
      sessionRef.child('messages').on('child_added', snap => {
        const msg = snap.val();
        displayMessage(msg);
      });

      // Typing Indicator Listener
      sessionRef.child(`typing/${currentPartnerId}`).on('value', snap => {
        if(snap.val() === true) {
          typingStatus.innerText = "Stranger is typing...";
        } else {
          typingStatus.innerText = "";
        }
      });
    }

    function renderPartnerInfo(info) {
      partnerTag.style.display = 'flex';
      partnerName.innerText = info.name || 'Stranger';
      partnerFlag.src = `https://flagcdn.com/w40/${info.country || 'un'}.png`;
    }

    function handlePartnerDisconnected() {
      partnerStatusLabel.innerText = "Partner disconnected";
      partnerTag.style.display = 'none';
      remoteVideo.srcObject = null;
      radarLoader.style.display = 'flex';
      loaderMessage.innerText = "Partner left. Click NEXT to find another.";
    }

    function cleanupCurrentSession() {
      if (activeSessionId) {
        db.ref(`sessions/${activeSessionId}`).remove();
        db.ref(`signals/${myUserId}`).remove();
        if (currentPartnerId) {
          db.ref(`signals/${currentPartnerId}`).remove();
        }
      }
      db.ref(`queue/${myUserId}`).remove();

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      activeSessionId = null;
      currentPartnerId = null;
      isInitiator = false;
      remoteVideo.srcObject = null;
      partnerTag.style.display = 'none';
      chatList.innerHTML = '';
      typingStatus.innerText = '';
    }

    /* 6. REAL-TIME CHAT & ACTIONS */
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !activeSessionId) return;

      const msgObj = {
        senderId: myUserId,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      db.ref(`sessions/${activeSessionId}/messages`).push(msgObj);
      chatInput.value = '';
      setTyping(false);
    });

    chatInput.addEventListener('input', () => {
      if (!activeSessionId) return;
      setTyping(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => setTyping(false), 2000);
    });

    function setTyping(isTyping) {
      if(activeSessionId) {
        db.ref(`sessions/${activeSessionId}/typing/${myUserId}`).set(isTyping);
      }
    }

    function sendEmoji(emoji) {
      if(!activeSessionId) return;
      db.ref(`sessions/${activeSessionId}/messages`).push({
        senderId: myUserId,
        text: emoji,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    function displayMessage(msg) {
      const isMe = msg.senderId === myUserId;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isMe ? 'me' : 'them'}`;
      bubble.innerHTML = `${escapeHtml(msg.text)} <div class="msg-time">${msg.time}</div>`;
      chatList.appendChild(bubble);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
