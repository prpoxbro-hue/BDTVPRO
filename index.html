<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMEN | Premium Video Connect</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f2fe;
      --neon-blue: #4facfe;
      --neon-purple: #7928ca;
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      height: 65px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(15px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-online::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 15px;
      padding: 15px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      height: calc(100vh - 65px);
    }

    .video-deck {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .videos-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .video-card {
      position: relative;
      background: #0d111b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-card.remote {
      border: 1px solid rgba(0, 242, 254, 0.25);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-card.local video {
      transform: scaleX(-1);
    }

    .user-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .user-tag img.flag {
      width: 18px;
      height: 12px;
      border-radius: 2px;
    }

    .screen-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-sub);
      text-align: center;
      padding: 15px;
      z-index: 1;
    }

    .radar-pulse {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.15);
      border: 2px solid var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
      70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 20px rgba(0, 242, 254, 0); }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
    }

    .controls-panel {
      height: 75px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(20px);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-size: 1rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-icon.off {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-next {
      height: 48px;
      padding: 0 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      color: #000;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
      gap: 8px;
    }

    .btn-next:active {
      transform: scale(0.97);
    }

    .chat-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      height: 100%;
    }

    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--neon-purple), #4f46e5);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .msg-bubble.them {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 2px;
    }

    .msg-time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 3px;
      text-align: right;
    }

    .chat-footer {
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 12px;
    }

    .chat-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
    }

    .chat-box button {
      background: transparent;
      border: none;
      color: var(--neon-cyan);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .videos-wrapper {
        height: 60vh;
      }
      .chat-panel {
        height: 350px;
      }
    }

    @media (max-width: 600px) {
      .videos-wrapper {
        grid-template-columns: 1fr;
        height: 70vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-bolt" style="color: var(--neon-cyan);"></i>
      <span>LUMEN TV</span>
    </div>
    <div class="badge-online">
      <span id="statOnlineCount">0</span> Online
    </div>
  </header>

  <main class="app-container">
    <section class="video-deck">
      <div class="videos-wrapper">
        
        <!-- Local Stream -->
        <div class="video-card local">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="user-tag">
            <img id="myFlag" class="flag" src="https://flagcdn.com/w40/un.png" alt="Country">
            <span id="myNameTag">You</span>
          </div>
        </div>

        <!-- Remote Stream -->
        <div class="video-card remote">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="user-tag" id="partnerTag" style="display: none;">
            <img id="partnerFlag" class="flag" src="https://flagcdn.com/w40/un.png" alt="Country">
            <span id="partnerName">Stranger</span>
          </div>
          
          <div class="screen-loader" id="radarLoader">
            <div class="radar-pulse">
              <i class="fa-solid fa-video" style="color: var(--neon-cyan); font-size: 1.3rem;"></i>
            </div>
            <p id="loaderMessage" style="max-width: 80%;">Click START to enable camera and find match</p>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <div class="controls-panel">
        <div class="ctrl-group">
          <button class="btn btn-icon" id="micBtn" title="Mute/Unmute Mic"><i class="fa-solid fa-microphone"></i></button>
          <button class="btn btn-icon" id="camBtn" title="Turn Camera Off"><i class="fa-solid fa-video"></i></button>
          <button class="btn btn-icon" id="switchCamBtn" title="Flip Camera"><i class="fa-solid fa-camera-rotate"></i></button>
        </div>

        <div class="ctrl-group">
          <button class="btn btn-next" id="nextBtn">
            <i class="fa-solid fa-play"></i>
            <span id="btnLabel">START</span>
          </button>
        </div>

        <div class="ctrl-group">
          <button class="btn btn-icon" id="fsBtn"><i class="fa-solid fa-expand"></i></button>
        </div>
      </div>
    </section>

    <!-- Side Chat -->
    <aside class="chat-panel">
      <div class="chat-header">
        <span>Live Chat</span>
        <span style="font-size:0.75rem; color:var(--text-sub);" id="partnerStatusLabel">Offline</span>
      </div>

      <div class="chat-messages" id="chatList">
        <div class="msg-bubble them">
          👋 Press START to activate your camera and connect.
          <div class="msg-time">System</div>
        </div>
      </div>

      <div class="chat-footer">
        <form class="chat-box" id="chatForm">
          <input type="text" id="chatInput" placeholder="Send a message..." autocomplete="off">
          <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </aside>
  </main>

  <script>
    /* FIREBASE CONFIGURATION */
    const firebaseConfig = {
      apiKey: "AIzaSyAB5pjAvTcmbiZ7Ibr63e5gINIONvby8qs",
      authDomain: "copytvlive.firebaseapp.com",
      databaseURL: "https://copytvlive-default-rtdb.firebaseio.com",
      projectId: "copytvlive",
      storageBucket: "copytvlive.firebasestorage.app",
      messagingSenderId: "904851982861",
      appId: "1:904851982861:web:3fdc5da725b88ea6a76344"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    let localStream = null;
    let peerConnection = null;
    let myUserId = null;
    let activeSessionId = null;
    let currentPartnerId = null;
    let isInitiator = false;
    let currentFacing = "user";

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const nextBtn = document.getElementById('nextBtn');
    const btnLabel = document.getElementById('btnLabel');
    const loaderMessage = document.getElementById('loaderMessage');
    const radarLoader = document.getElementById('radarLoader');
    const partnerTag = document.getElementById('partnerTag');
    const partnerStatusLabel = document.getElementById('partnerStatusLabel');
    const chatList = document.getElementById('chatList');
    const chatInput = document.getElementById('chatInput');

    // Sign in anonymously immediately
    auth.signInAnonymously().then(res => {
      myUserId = res.user.uid;
      
      // Update online count
      const userRef = db.ref(`users/${myUserId}`);
      db.ref(".info/connected").on("value", snap => {
        if (snap.val() === true) {
          userRef.onDisconnect().remove();
          userRef.set({ online: true, ts: Date.now() });
        }
      });

      db.ref('users').on('value', snap => {
        document.getElementById('statOnlineCount').innerText = snap.numChildren();
      });

      // Listen for incoming pairing invites
      listenForDirectSignals();
    }).catch(err => {
      alert("Database error: " + err.message);
    });

    /* ROBUST CAMERA GRABBER (Solves blank camera issue) */
    async function startCamera() {
      if (localStream) return true; // Already running

      loaderMessage.innerText = "Requesting camera/microphone access...";
      
      const constraintsList = [
        { video: { facingMode: currentFacing }, audio: true },
        { video: true, audio: true },
        { video: true, audio: false } // Fallback if mic fails
      ];

      for (let constraints of constraintsList) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia(constraints);
          localVideo.srcObject = localStream;
          await localVideo.play();
          loaderMessage.innerText = "Camera connected. Click NEXT to find partner.";
          return true;
        } catch (e) {
          console.warn("Retrying with flexible constraints...", e);
        }
      }

      loaderMessage.innerHTML = "<span style='color:var(--danger);'>Error: Please allow Camera & Microphone permissions in your browser address bar.</span>";
      alert("Camera Permission Denied or Not Supported. Please check browser permissions.");
      return false;
    }

    /* MATCHMAKING & NEXT HANDLER */
    nextBtn.addEventListener('click', async () => {
      // 1. Ensure Camera is turned on by user click
      const camOk = await startCamera();
      if (!camOk) return;

      cleanupSession();

      btnLabel.innerText = "SEARCHING";
      radarLoader.style.display = "flex";
      loaderMessage.innerText = "Searching for an online user...";
      partnerStatusLabel.innerText = "Matching...";

      // Matchmaking Queue Engine
      const queueRef = db.ref('queue');
      
      queueRef.once('value').then(snap => {
        const queue = snap.val() || {};
        const keys = Object.keys(queue);
        const partnerKey = keys.find(k => k !== myUserId);

        if (partnerKey) {
          // Found someone waiting! Create session
          queueRef.child(partnerKey).remove();
          createSessionWith(partnerKey);
        } else {
          // Nobody found, push myself to queue
          queueRef.child(myUserId).set({ time: Date.now() });
          queueRef.child(myUserId).onDisconnect().remove();
        }
      });
    });

    /* CREATE OR JOIN SESSION */
    async function createSessionWith(partnerUid) {
      isInitiator = true;
      currentPartnerId = partnerUid;
      activeSessionId = db.ref('sessions').push().key;

      // Notify other user
      await db.ref(`signals/${partnerUid}`).set({
        sessionId: activeSessionId,
        partnerId: myUserId
      });

      initWebRTC();
    }

    function listenForDirectSignals() {
      db.ref(`signals/${myUserId}`).on('value', async snap => {
        const val = snap.val();
        if (val && val.sessionId && !activeSessionId) {
          activeSessionId = val.sessionId;
          currentPartnerId = val.partnerId;
          isInitiator = false;

          // Remove myself from queue if I was waiting
          db.ref(`queue/${myUserId}`).remove();
          db.ref(`signals/${myUserId}`).remove();

          initWebRTC();
        }
      });
    }

    /* WEBRTC PEER CONNECTION */
    async function initWebRTC() {
      btnLabel.innerText = "NEXT";
      loaderMessage.innerText = "Establishing secure connection...";
      partnerStatusLabel.innerText = "Connecting...";

      peerConnection = new RTCPeerConnection(rtcConfig);

      // Add tracks
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Receive tracks
      peerConnection.ontrack = e => {
        if (remoteVideo.srcObject !== e.streams[0]) {
          remoteVideo.srcObject = e.streams[0];
          radarLoader.style.display = "none";
          partnerTag.style.display = "flex";
          partnerStatusLabel.innerText = "Connected";
        }
      };

      // Handle ICE Candidates
      const myCandidatePath = isInitiator ? 'callerCandidates' : 'calleeCandidates';
      const partnerCandidatePath = isInitiator ? 'calleeCandidates' : 'callerCandidates';

      peerConnection.onicecandidate = e => {
        if (e.candidate && activeSessionId) {
          db.ref(`sessions/${activeSessionId}/${myCandidatePath}`).push(e.candidate.toJSON());
        }
      };

      // Listen for partner's candidates
      db.ref(`sessions/${activeSessionId}/${partnerCandidatePath}`).on('child_added', snap => {
        const candidate = snap.val();
        if (candidate) {
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(console.error);
        }
      });

      const sessionRef = db.ref(`sessions/${activeSessionId}`);

      if (isInitiator) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await sessionRef.set({
          offer: { type: offer.type, sdp: offer.sdp }
        });

        // Listen for Answer
        sessionRef.child('answer').on('value', async snap => {
          const answer = snap.val();
          if (answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          }
        });
      } else {
        // Callee: Wait for offer, then create answer
        sessionRef.child('offer').on('value', async snap => {
          const offer = snap.val();
          if (offer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await sessionRef.update({
              answer: { type: answer.type, sdp: answer.sdp }
            });
          }
        });
      }

      // Live Chat for this session
      sessionRef.child('messages').on('child_added', snap => {
        const msg = snap.val();
        renderMessage(msg);
      });

      peerConnection.oniceconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(peerConnection.iceConnectionState)) {
          partnerStatusLabel.innerText = "Stranger left";
          remoteVideo.srcObject = null;
          partnerTag.style.display = "none";
          radarLoader.style.display = "flex";
          loaderMessage.innerText = "Partner disconnected. Click NEXT.";
        }
      };
    }

    function cleanupSession() {
      if (activeSessionId) {
        db.ref(`sessions/${activeSessionId}`).remove();
      }
      db.ref(`queue/${myUserId}`).remove();
      db.ref(`signals/${myUserId}`).remove();

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      activeSessionId = null;
      currentPartnerId = null;
      remoteVideo.srcObject = null;
      partnerTag.style.display = "none";
      chatList.innerHTML = '';
    }

    /* CHAT ACTIONS */
    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const txt = chatInput.value.trim();
      if (!txt || !activeSessionId) return;

      db.ref(`sessions/${activeSessionId}/messages`).push({
        sender: myUserId,
        text: txt,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      chatInput.value = '';
    });

    function renderMessage(msg) {
      const isMe = msg.sender === myUserId;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isMe ? 'me' : 'them'}`;
      bubble.innerHTML = `${escapeHtml(msg.text)} <div class="msg-time">${msg.time}</div>`;
      chatList.appendChild(bubble);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function escapeHtml(str) {
      const p = document.createElement('p');
      p.appendChild(document.createTextNode(str));
      return p.innerHTML;
    }

    /* MEDIA CONTROLS */
    document.getElementById('micBtn').addEventListener('click', () => {
      if (!localStream) return;
      const audio = localStream.getAudioTracks()[0];
      if (audio) {
        audio.enabled = !audio.enabled;
        document.getElementById('micBtn').classList.toggle('off', !audio.enabled);
        document.getElementById('micBtn').innerHTML = audio.enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
      }
    });

    document.getElementById('camBtn').addEventListener('click', () => {
      if (!localStream) return;
      const video = localStream.getVideoTracks()[0];
      if (video) {
        video.enabled = !video.enabled;
        document.getElementById('camBtn').classList.toggle('off', !video.enabled);
        document.getElementById('camBtn').innerHTML = video.enabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
      }
    });

    document.getElementById('switchCamBtn').addEventListener('click', async () => {
      currentFacing = (currentFacing === "user") ? "environment" : "user";
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      await startCamera();
      if (peerConnection && localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && videoTrack) sender.replaceTrack(videoTrack);
      }
    });

    document.getElementById('fsBtn').addEventListener('click', () => {
      const el = document.querySelector('.videos-wrapper');
      if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    });

    window.addEventListener('beforeunload', cleanupSession);
  </script>
</body>
</html>
